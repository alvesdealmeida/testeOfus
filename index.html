<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
    </style>
</head>
<body>
<script>
(function(){var _0x0=["log","warn","error"];_0x0.forEach(function(m){console[m]=function(){};});})();
setInterval(function(){debugger;}, 500);
(function(){

const config = {
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    physics: { default: '\x61\x72\x63\x61\x64\x65', arcade: { gravity: { y: 0 } } },
    scene: { preload, create, update }
};

let pipaJogador, pipaIA, rabiolaJogador, rabiolaIA;
let labelJogador, labelIA;
let nivelAtual = 1, emDesafio = false, aguardandoProximaMao = false;
let acertosNoConfronto = 0, errosNoConfronto = 0, jogoFinalizado = false;
let containerUI, textoPergunta, botoesResposta = [], textoFeedback, textoNivel;
let pipasFestival = []; 
let tempoQuestao = 10, textoCronometro, timerQuestao;
let coresCeu = [0x87CEEB, 0xFFA500, 0x191970];
let nomesNiveis = ["\x42\x52\x49\x53\x41", "\x56\x45\x4e\x54\x41\x4e\x49\x41", "\x46\x55\x52\x41\x43\xc3\x4f"];
let questaoAtual = {};

const game = new Phaser.Game(config);

function preload() {
    let g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xffffff);
    g.fillPoints([{ x: 20, y: 0 }, { x: 40, y: 20 }, { x: 20, y: 40 }, { x: 0, y: 20 }], true);
    g.generateTexture('\x70\x69\x70\x61', 40, 40);
    
    g.clear();
    g.fillStyle(0xFFD700);
    g.fillRect(10, 20, 30, 20); g.fillRect(22, 40, 6, 10); g.fillRect(15, 50, 20, 5);
    g.generateTexture('\x74\x61\x63\x61', 50, 60);
}

function create() {
    this.bg = this.add.rectangle(0, 0, config.width, config.height, coresCeu[0]).setOrigin(0);

    const coresPipas = [0x32CD32, 0xBA55D3, 0xFF69B4, 0xFFA500, 0xADFF2F, 0x00FF7F];
    for(let i=0; i<15; i++) {
        let px = Phaser.Math.Between(50, config.width - 50);
        let py = Phaser.Math.Between(50, config.height - 50);
        let p = this.add.sprite(px, py, '\x70\x69\x70\x61').setTint(Phaser.Utils.Array.GetRandom(coresPipas)).setAlpha(0.6);
        let rab = criarRabiola(this, p, p.tintTopLeft);
        pipasFestival.push({ sprite: p, rabiola: rab, vy: Phaser.Math.FloatBetween(-0.4, -0.9) });
    }

    pipaJogador = this.physics.add.sprite(config.width/2, config.height-150, '\x70\x69\x70\x61').setTint(0x00ffff).setDepth(10);
    labelJogador = this.add.text(0, 0, '\x56\x4f\x43\xca', {fontSize:'\x31\x34\x70\x78', fontStyle:'\x62\x6f\x6c\x64', fill:'\x23\x30\x30\x66\x66\x66\x66', stroke:'\x23\x30\x30\x30', strokeThickness:3}).setOrigin(0.5, 2.3);
    rabiolaJogador = criarRabiola(this, pipaJogador, 0xffffff);

    pipaIA = this.physics.add.sprite(config.width/2, -100, '\x70\x69\x70\x61').setTint(0xff0000).setDepth(10);
    labelIA = this.add.text(0, 0, '\x49\x41', {fontSize:'\x31\x34\x70\x78', fontStyle:'\x62\x6f\x6c\x64', fill:'\x23\x66\x66\x30\x30\x30\x30', stroke:'\x23\x30\x30\x30', strokeThickness:3}).setOrigin(0.5, 2.3);
    rabiolaIA = criarRabiola(this, pipaIA, 0xff0000);

    textoNivel = this.add.text(20, 20, '\x4e\xcd\x56\x45\x4c\x3a\x20\x42\x52\x49\x53\x41', { fontSize: '\x32\x32\x70\x78', fill: '\x23\x66\x66\x66', fontStyle: '\x62\x6f\x6c\x64', stroke: '\x23\x30\x30\x30', strokeThickness: 4 });
    textoFeedback = this.add.text(config.width/2, config.height/2 - 100, '', { fontSize: '\x33\x38\x70\x78', fill: '\x23\x66\x66\x66', fontStyle: '\x62\x6f\x6c\x64', stroke: '\x23\x30\x30\x30', strokeThickness: 8, align: '\x63\x65\x6e\x74\x65\x72' }).setOrigin(0.5).setDepth(100).setVisible(false);

    criarPainelLateral(this);
    
    this.physics.add.overlap(pipaJogador, pipaIA, tratarColisao, null, this);
}

function update() {
    if (jogoFinalizado) return;

    labelJogador.setPosition(pipaJogador.x, pipaJogador.y);
    labelIA.setPosition(pipaIA.x, pipaIA.y);

    pipasFestival.forEach(obj => {
        obj.sprite.y += obj.vy;
        if(obj.sprite.y < -60) obj.sprite.y = config.height + 60;
        atualizarRabiola(obj.sprite, obj.rabiola, true);
    });

    
    if (containerUI.visible) {
        atualizarRabiola(pipaJogador, rabiolaJogador, true);
        atualizarRabiola(pipaIA, rabiolaIA, true);
        return; 
    }

    
    if (this.input.activePointer.isDown) {
        pipaJogador.x = Phaser.Math.Linear(pipaJogador.x, this.input.activePointer.x, 0.1);
        pipaJogador.y = Phaser.Math.Linear(pipaJogador.y, this.input.activePointer.y, 0.1);
    }

    
    let velIA = 0.02 + (nivelAtual * 0.015);
    pipaIA.x = Phaser.Math.Linear(pipaIA.x, pipaJogador.x, velIA);
    pipaIA.y = Phaser.Math.Linear(pipaIA.y, pipaJogador.y - 120, velIA);

    atualizarRabiola(pipaJogador, rabiolaJogador, false);
    atualizarRabiola(pipaIA, rabiolaIA, false);
}

function tratarColisao() {
    
    if (emDesafio || aguardandoProximaMao || jogoFinalizado) return;
    
    emDesafio = true;
    pipaIA.body.setEnable(false);
    pipaJogador.body.setEnable(false);
    mostrarPergunta();
}

function mostrarPergunta() {
    questaoAtual = gerarQuestao(nivelAtual);
    tempoQuestao = 10;
    textoPergunta.setText(questaoAtual.p);
    botoesResposta.forEach((btn, i) => btn.label.setText(questaoAtual.op[i]));
    
    containerUI.setVisible(true);
    
    if(timerQuestao) timerQuestao.remove();
    timerQuestao = game.scene.scenes[0].time.addEvent({
        delay: 1000, callback: () => {
            tempoQuestao--;
            textoCronometro.setText(tempoQuestao);
            if(tempoQuestao <= 0) processarEscolha("\x45\x52\x52\x4f\x55");
        }, loop: true
    });
}

function processarEscolha(resp) {
    if(timerQuestao) timerQuestao.remove();
    containerUI.setVisible(false);

    if (resp == questaoAtual.r) {
        tocarSom(800, 0.1);
        acertosNoConfronto++;
        if (acertosNoConfronto < 3) prepararProximoEnrosco("\x44\x52\x49\x42\x41\x4c\x4f\x55\x21");
        else vitoriaCorte();
    } else {
        tocarSom(200, 0.3);
        errosNoConfronto++;
        if (errosNoConfronto < 3) prepararProximoEnrosco("\x45\x53\x54\x49\x43\x4f\x55\x21");
        else derrotaQueda();
    }
}

function prepararProximoEnrosco(msg) {
    textoFeedback.setText(msg).setVisible(true);
    emDesafio = false; 
    aguardandoProximaMao = true; 

    
    pipaIA.body.setEnable(true);
    pipaJogador.body.setEnable(true);

    
    game.scene.scenes[0].time.addEvent({ 
        delay: 3000, 
        callback: () => { 
            textoFeedback.setVisible(false); 
            aguardandoProximaMao = false; 
        } 
    });
}

function vitoriaCorte() {
    tocarSom(1000, 0.5);
    pipaIA.body.setEnable(true);
    pipaIA.setAngularVelocity(1000);
    game.scene.scenes[0].physics.moveTo(pipaIA, pipaIA.x, config.height + 500, 400);

    if (nivelAtual === 3) {
        soltarPremeacaoFinal();
    } else {
        nivelAtual++;
        textoFeedback.setText("\x52\x45\x4c\x4f\x21\x20\x50\x52\xd3\x58\x49\x4d\x4f\x20\x4e\xcd\x56\x45\x4c").setVisible(true);
        game.scene.scenes[0].time.addEvent({
            delay: 2000, callback: () => {
                game.scene.scenes[0].bg.fillColor = coresCeu[nivelAtual-1];
                textoNivel.setText("\x4e\xcd\x56\x45\x4c\x3a\x20" + nomesNiveis[nivelAtual-1]);
                resetarDuelo();
            }
        });
    }
}

function soltarPremeacaoFinal() {
    jogoFinalizado = true;
    textoFeedback.setText("\x43\x41\x4d\x50\x45\xc3\x4f\x20\x44\x4f\x20\x46\x45\x53\x54\x49\x56\x41\x4c\x21").setVisible(true);
    let taca = game.scene.scenes[0].add.image(config.width/2, config.height/2 - 50, '\x74\x61\x63\x61').setScale(0).setDepth(150);
    game.scene.scenes[0].tweens.add({ targets: taca, scale: 4, angle: 360, duration: 1000, ease: '\x42\x61\x63\x6b\x2e\x65\x61\x73\x65\x4f\x75\x74' });
    for(let i=0; i<80; i++) {
        let c = game.scene.scenes[0].add.circle(config.width/2, config.height/2, 5, Phaser.Math.Between(0x000000, 0xffffff));
        game.scene.scenes[0].physics.add.existing(c);
        c.body.setVelocity(Phaser.Math.Between(-400, 400), Phaser.Math.Between(-700, -200));
        c.body.setGravityY(400);
    }
    let btnDinamico = game.scene.scenes[0].add.container(config.width/2, config.height/2 + 150).setDepth(200);
    let ret = game.scene.scenes[0].add.rectangle(0, 0, 240, 70, 0x00ff00).setInteractive().setStrokeStyle(4, 0xffffff);
    let txtBtn = game.scene.scenes[0].add.text(0, 0, '\x4a\x4f\x47\x41\x52\x20\x44\x45\x20\x4e\x4f\x56\x4f', { fontSize: '\x32\x34\x70\x78', fill: '\x23\x30\x30\x30', fontStyle: '\x62\x6f\x6c\x64' }).setOrigin(0.5);
    btnDinamico.add([ret, txtBtn]);
    ret.on('\x70\x6f\x69\x6e\x74\x65\x72\x64\x6f\x77\x6e', () => location.reload());
}

function resetarDuelo() {
    textoFeedback.setVisible(false);
    emDesafio = false;
    aguardandoProximaMao = false;
    acertosNoConfronto = 0;
    errosNoConfronto = 0;
    pipaJogador.body.setEnable(true);
    pipaIA.setPosition(Phaser.Math.Between(100, config.width-100), -150);
    pipaIA.setAngularVelocity(0).setAngle(0);
}

function derrotaQueda() {
    containerUI.setVisible(false);
    textoFeedback.setText("\x4c\x45\x56\x4f\x55\x20\x52\xc9\x4c\x4f\x21").setVisible(true);
    pipaJogador.body.setEnable(true);
    game.scene.scenes[0].tweens.add({ targets: pipaJogador, y: config.height + 300, angle: 720, duration: 4000, onComplete: () => location.reload() });
}

function tocarSom(freq, dur) {
    try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
        osc.start(); osc.stop(ctx.currentTime + dur);
    } catch(e){}
}

function criarPainelLateral(scene) {
    const largura = Math.min(config.width * 0.45, 260);
    containerUI = scene.add.container(config.width - largura/2 - 10, largura/2 + 60).setDepth(200).setVisible(false);
    let fundo = scene.add.rectangle(0, 0, largura, 380, 0xffffff, 0.9).setStrokeStyle(3, 0x00ffff);
    textoPergunta = scene.add.text(0, -110, '', { fontSize: '\x31\x38\x70\x78', fill: '\x23\x30\x30\x30', fontStyle: '\x62\x6f\x6c\x64', align: '\x63\x65\x6e\x74\x65\x72', wordWrap: { width: largura - 20 } }).setOrigin(0.5);
    textoCronometro = scene.add.text(0, -165, '\x31\x30', { fontSize: '\x33\x30\x70\x78', fill: '\x23\x66\x66\x30\x30\x30\x30', fontStyle: '\x62\x6f\x6c\x64' }).setOrigin(0.5);
    containerUI.add([fundo, textoPergunta, textoCronometro]);
    for (let i = 0; i < 3; i++) {
        let btn = scene.add.rectangle(0, 30 + (i * 75), largura - 30, 60, 0x00ffff).setInteractive();
        let txt = scene.add.text(0, 30 + (i * 75), '', { fontSize: '\x32\x30\x70\x78', fill: '\x23\x30\x30\x30', fontStyle: '\x62\x6f\x6c\x64' }).setOrigin(0.5);
        btn.on('\x70\x6f\x69\x6e\x74\x65\x72\x64\x6f\x77\x6e', () => processarEscolha(txt.text));
        botoesResposta.push({ rect: btn, label: txt });
        containerUI.add([btn, txt]);
    }
}

function gerarQuestao(n) {
    let a, b, r, txt;
    if(n === 1) { a = Phaser.Math.Between(5, 15); b = Phaser.Math.Between(1, 10); r = a + b; txt = `RESOLVA:\n${a} + ${b}`; }
    else if(n === 2) { a = Phaser.Math.Between(20, 50); b = Phaser.Math.Between(10, 20); r = a - b; txt = `CALCULE:\n${a} - ${b}`; }
    else { a = Phaser.Math.Between(3, 9); b = Phaser.Math.Between(3, 7); r = a * b; txt = `TABUADA:\n${a} x ${b}`; }
    let ops = [r, r + 3, r - 2].sort(() => Math.random() - 0.5);
    return { p: txt, r: r, op: ops };
}

function criarRabiola(scene, pai, cor) {
    let arr = [];
    for(let i=0; i<10; i++) arr.push(scene.add.circle(0,0,4,cor).setAlpha(0.5));
    return arr;
}

function atualizarRabiola(pai, arr, desafiando) {
    arr.forEach((seg, i) => {
        let alvo = (i === 0) ? pai : arr[i-1];
        let vento = desafiando ? Math.sin(Date.now()/200 + i) * 12 : Math.sin(Date.now()/500 + i) * 5;
        seg.x = Phaser.Math.Linear(seg.x, alvo.x + vento, 0.2);
        seg.y = Phaser.Math.Linear(seg.y, alvo.y + 10, 0.2);
    });
}

})();
</script>
</body>
</html>
